name: Build Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"
      - name: Create local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Create key.properties if secrets exist
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "storeFile=release.keystore" > android/key.properties
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          fi
      - name: Decode Keystore if secrets exist
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Build Release APK
        run: flutter build apk --release
      - name: Rename APK with version
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/BabyBuddy-${{ steps.version.outputs.version }}.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabyBuddy-v${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/BabyBuddy-${{ steps.version.outputs.version }}.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: BabyBuddy-v${{ needs.build.outputs.version }}
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Baby Buddy v${{ needs.build.outputs.version }}
          body: |
            ## Baby Buddy v${{ needs.build.outputs.version }}

            ### 安装方式
            下载下方 APK 文件安装即可。

            ### 功能
            - 账号密码 / API Key 双模式登录
            - 多宝宝左右滑动切换
            - 尿布一键速记
            - 重建默认定时器
            - 长按记录打开服务器网页
          files: artifacts/BabyBuddy-${{ needs.build.outputs.version }}.apk
          draft: false
          prerelease: false
